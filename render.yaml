services:
  - type: web
    name: gold-game-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: ROUND_LENGTH_SECONDS
        value: "1800"
      - key: PAYOUT_MULTIPLIER
        value: "9"
      - key: OTP_EXPIRE_SECONDS
        value: "300"
      - key: DEBUG
        value: "true"
